{% extends "base.html" %}

{% block title %}Departments{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Departments</h1>

<div class="row g-4">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table mb-0">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Employees</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            {% for department in departments %}
              <tr>
                <td>
                  <form method="post" action="{{ url_for('admin.rename_department', department_id=department.id) }}" class="d-flex gap-2">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="text" name="name" value="{{ department.name }}" class="form-control form-control-sm" required>
                    <button type="submit" class="btn btn-sm btn-outline-primary">Rename</button>
                  </form>
                </td>
                <td>{{ department.employee_count }}</td>
                <td class="text-end">
                  <form method="post" action="{{ url_for('admin.delete_department', department_id=department.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                  </form>
                </td>
              </tr>
            {% else %}
              <tr><td colspan="3" class="text-center text-muted py-4">No departments yet.</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3">Add department</h2>
        <form method="post" action="{{ url_for('admin.create_department') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <input type="text" class="form-control" id="description" name="description">
          </div>
          <button type="submit" class="btn btn-primary">Add department</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
